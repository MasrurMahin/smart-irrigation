<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Irrigation System - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-box">
    <h1>Smart Irrigation System</h1>
    <p class="subtitle">Group 23 &middot; CSE 3206 &middot; RUET</p>

    <div class="tabs">
      <button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
      <button id="tabRegister" onclick="showTab('register')">Register</button>
    </div>

    <p id="message" class="message"></p>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" required>
      <label>Password</label>
      <input type="password" id="loginPassword" required>
      <button type="submit">Login</button>
      <p class="hint">Demo: demo@demo.com / 123456</p>
    </form>

    <form id="registerForm" class="hidden">
      <label>Name</label>
      <input type="text" id="regName" required>
      <label>Email</label>
      <input type="email" id="regEmail" required>
      <label>Password</label>
      <input type="password" id="regPassword" required>
      <button type="submit">Create account</button>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
